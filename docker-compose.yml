services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    restart: unless-stopped
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - api
    restart: unless-stopped
